name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" | sed 's/=main$/=1.0.0/' >> $GITHUB_ENV
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar extensao + MSIX + setup.exe
        run: .\windows\build.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        run: echo "VERSION=${GITHUB_REF_NAME#v}" | sed 's/=main$/=1.0.0/' >> $GITHUB_ENV
      - name: Gerar .pkg e .zip
        run: |
          bash macos/build-pkg.sh "$VERSION"
          chmod +x macos/*.sh macos/*.command
          mkdir -p "dist/FastInstallAPK-mac"
          cp macos/fast-apk.sh macos/install.sh macos/uninstall.sh macos/*.command "dist/FastInstallAPK-mac/"
          (cd dist && zip -r "FastInstallAPK-mac-$VERSION.zip" FastInstallAPK-mac)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.pkg
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
